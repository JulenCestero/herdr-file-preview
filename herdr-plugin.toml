id = "jc.file-preview"
name = "File Preview"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Ctrl+click a file:// link and preview it in a right-side Herdr pane instead of launching an external app."
platforms = ["linux", "macos", "windows"]

[[actions]]
id = "open"
title = "Preview file"
command = ["node", "action.js"]

[[panes]]
id = "preview"
title = "File preview"
placement = "split"
command = ["node", "preview.js"]

[[link_handlers]]
id = "file-uri"
title = "Preview file:// link"
pattern = "^file://"
action = "open"
